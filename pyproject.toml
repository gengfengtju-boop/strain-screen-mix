[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proslim-microbiome-ai"
version = "0.1.0"
description = "Public-database framework for probiotic weight-management microbiome prediction and strain-combination ranking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
modeling = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "shap>=0.44"
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5"
]

[project.scripts]
proslim-ai = "proslim_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
