jobs:
  - name: pubmed_probiotic_abdominal_obesity_rct_expansion2
    command: search_evidence
    source: pubmed
    query: probiotic abdominal obesity randomized placebo waist circumference
    output: data/literature_database/pubmed_probiotic_abdominal_obesity_rct_expansion2_candidates.csv
    retmax: 80
