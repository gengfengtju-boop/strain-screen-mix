obesity_models:
  BMI_regression:
    implementation_status: baseline_implemented_requires_real_sample_data
    implemented_algorithm: ElasticNet
    planned_algorithms:
      - RandomForestRegressor
      - XGBoostRegressor
      - LightGBMRegressor
    metrics:
      - RMSE
      - MAE
      - R2
      - Pearson
      - Spearman
  obesity_classification:
    implementation_status: baseline_implemented_requires_real_sample_data
    implemented_algorithm: LogisticRegression_regularized
    planned_algorithms:
      - RandomForestClassifier
      - XGBoostClassifier
      - LightGBMClassifier
    metrics:
      - AUC
      - accuracy
      - balanced_accuracy
      - precision
      - recall
      - F1

responder_models:
  implementation_status: study_endpoint_evidence_classifier_only
  warning: not_an_individual_responder_model
  validation: nested_stratified_group_cv_by_evidence_id
  leakage_policy: label_derived_fields_excluded
  tasks:
    - weight_response
    - BMI_response
    - waist_response
    - lipid_response
    - glucose_response
    - microbiome_response
    - composite_response
  candidate_algorithms:
    - LogisticRegression_regularized
    - RandomForestClassifier
    - GradientBoostingClassifier
    - DummyClassifier_prior

interpretability:
  feature_importance: limited_to_selected_tree_models
  SHAP: planned
  permutation_importance: planned
