jobs:
  - name: pubmed_probiotic_obesity
    command: search_evidence
    source: pubmed
    query: probiotic obesity weight loss
    output: data/literature_database/pubmed_probiotic_obesity_candidates.csv
    retmax: 50
  - name: pubmed_probiotic_rct
    command: search_evidence
    source: pubmed
    query: probiotic overweight BMI randomized controlled trial
    output: data/literature_database/pubmed_probiotic_rct_candidates.csv
    retmax: 50
  - name: pubmed_synbiotic_obesity
    command: search_evidence
    source: pubmed
    query: synbiotic obesity BMI microbiome
    output: data/literature_database/pubmed_synbiotic_obesity_candidates.csv
    retmax: 50
  - name: pubmed_prebiotic_obesity
    command: search_evidence
    source: pubmed
    query: prebiotic obesity weight loss microbiome
    output: data/literature_database/pubmed_prebiotic_obesity_candidates.csv
    retmax: 50
  - name: pubmed_lactobacillus_gasseri
    command: search_evidence
    source: pubmed
    query: Lactobacillus gasseri obesity weight loss
